{% extends "_base.html" %}

{% block title %}Editar Artículo{% endblock %}

{% block content %}
    <h1>Editar artículo</h1>

    <form action="" method="post">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit">Actualizar Artículo</button>
    </form>

    <br>
    <a href="{% url 'article_detail' article.pk %}">Cancelar y volver al artículo</a>
{% endblock %}
